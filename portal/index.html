<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0D0A1A;--accent:#9333EA;--accent-soft:#F1E7FD;--secondary:#F7F4FF;
  --text:#2C2C2C;--text-light:#5f5a6e;--border:#E4E0EE;--white:#fff;
  --amber:#B45309;--amber-bg:#FEF3C7;--red:#B91C1C;--red-bg:#FEE2E2;
  --green:#15803D;--green-bg:#DCFCE7;--blue:#1D4ED8;--blue-bg:#DBEAFE;
  --gray:#57534E;--gray-bg:#EEECEA;--violet:#7E22CE;--violet-bg:#F3E8FF;
  --radius:12px;--mono:'DM Mono',ui-monospace,monospace
}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--secondary);color:var(--text);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
.top{background:var(--primary);color:#EDE8FF;border-bottom:1px solid rgba(147,51,234,.25);position:sticky;top:0;z-index:50}
.top-inner{max-width:1400px;margin:0 auto;padding:1rem 2rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.top-logo{height:30px;display:block}
.top-sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
.top-title{display:flex;flex-direction:column;line-height:1.15}
.top-title small{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(200,185,240,.7)}
.top-title strong{font-size:1.15rem;font-weight:600}
.top-actions{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.top select,.top .btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EDE8FF;border-radius:8px;padding:.45rem .7rem;font-size:.85rem}
.top select option{color:#111}
.top .btn-ghost:hover{background:rgba(255,255,255,.16)}
.demo-bar{background:var(--accent);color:#fff;text-align:center;font-size:.82rem;padding:.4rem 1rem}
.demo-bar button{background:#fff;color:var(--accent);border:0;border-radius:6px;padding:.15rem .6rem;margin-left:.5rem;font-weight:600;font-size:.8rem}

main{max-width:1400px;margin:0 auto;padding:2rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.75rem}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;cursor:pointer;transition:border-color .2s,transform .2s;text-align:left}
.stat:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stat-num{font-size:2rem;font-weight:800;line-height:1;color:var(--primary)}
.stat-label{font-size:.85rem;color:var(--text-light);margin-top:.35rem}
.stat.warn .stat-num{color:var(--red)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--white);border-radius:999px;padding:.35rem .85rem;font-size:.85rem;display:inline-flex;align-items:center;gap:.45rem}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar .spacer{flex:1}
/* hub-style tabs */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{border:0;background:transparent;padding:.7rem 1.1rem;font-size:1rem;font-weight:600;color:var(--text-light);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--accent)}
.tab .n{font-size:.75rem;font-weight:700;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:.05rem .5rem}
.tab.manage{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px 10px 0 0}
.tab.manage.active{background:var(--primary);border-bottom-color:var(--primary)}
.tab.manage .n{background:#fff;color:var(--accent)}
.preview-strip{background:var(--primary);color:#EDE8FF;font-size:.9rem;padding:.55rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:center;flex-wrap:wrap}
.preview-strip button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:.3rem .8rem;font-weight:600}
.subtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.sec{margin-bottom:2.2rem}
.sec-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.sec-head h3{font-size:1.15rem;color:var(--primary)}
.sec-head .btn{margin-left:auto}
.rows{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.r{display:flex;gap:1rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.r:last-child{border-bottom:0}
.r .main{flex:1;min-width:220px}
.r .sub{font-size:.8rem;color:var(--text-light);margin-top:.15rem}
.r .q{font-size:.88rem;margin-top:.3rem;white-space:pre-wrap}
.r .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.lnk{border:0;background:none;padding:0;color:var(--primary);font-weight:600;text-align:left}
.lnk:hover{color:var(--accent);text-decoration:underline}
.tblwrap{overflow-x:auto;background:var(--white);border:1px solid var(--border);border-radius:var(--radius)}
table.mt{width:100%;border-collapse:collapse;font-size:.88rem;min-width:760px}
table.mt th{text-align:left;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-light);padding:.65rem .8rem;border-bottom:1px solid var(--border);background:#FBFAFE}
table.mt td{padding:.6rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
table.mt tr:last-child td{border-bottom:0}
table.mt td.d{font-family:var(--mono);font-size:.78rem;color:var(--text-light);white-space:nowrap}
.cdot{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.cdot i{width:9px;height:9px;border-radius:50%;display:inline-block}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:.4rem .9rem;border-radius:7px;font-size:.88rem;color:var(--text-light)}
.seg button.active{background:var(--accent);color:#fff}
select.plain{border:1px solid var(--border);background:var(--white);border-radius:10px;padding:.45rem .7rem;font-size:.88rem}

.btn{border:1px solid var(--border);background:var(--white);border-radius:10px;padding:.5rem .95rem;font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:.4rem;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#7E22CE}
.btn-dark{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-approve{background:var(--green);border-color:var(--green);color:#fff}
.btn-approve:hover{background:#166534;border-color:#166534}
.btn-changes{background:var(--white);border-color:var(--red);color:var(--red)}
.btn-changes:hover{background:var(--red-bg);border-color:var(--red)}
.btn-danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:.3rem .65rem;font-size:.8rem;border-radius:8px}

/* campaign groups */
.campaign{margin-bottom:2.5rem}
.camp-head{display:flex;align-items:flex-start;gap:.9rem;margin-bottom:1rem}
.camp-bar{width:6px;align-self:stretch;border-radius:3px;min-height:38px}
.camp-head h2{font-size:1.45rem;color:var(--primary);font-weight:800}
.camp-meta{font-family:var(--mono);font-size:.78rem;color:var(--text-light);margin-top:.15rem}
.camp-desc{color:var(--text-light);font-size:.92rem;margin-top:.3rem;max-width:760px}
.camp-head .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.1rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;text-align:left;padding:0}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(13,10,26,.09)}
.thumb{aspect-ratio:4/3;background:var(--secondary);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:.4rem;color:#fff;font-weight:600;font-size:.9rem}
.thumb .ph svg{width:38px;height:38px;opacity:.95}
.thumb .badge{position:absolute;top:.6rem;left:.6rem}
.thumb .ver{position:absolute;top:.6rem;right:.6rem;font-family:var(--mono);font-size:.72rem;background:rgba(13,10,26,.75);color:#fff;border-radius:6px;padding:.1rem .45rem}
.card-body{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.card-title{font-weight:600;color:var(--primary);font-size:1.02rem;line-height:1.3}
.card-meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-family:var(--mono);font-size:.75rem;color:var(--text-light)}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.35rem}
.due{font-size:.8rem;font-weight:500}
.due.overdue{color:var(--red)}
.due.soon{color:var(--amber)}
.ccount{font-size:.8rem;color:var(--text-light);display:inline-flex;align-items:center;gap:.25rem}

.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.18rem .6rem;font-size:.74rem;font-weight:600;white-space:nowrap}
.s-draft{background:var(--gray-bg);color:var(--gray)}
.s-in_review{background:var(--amber-bg);color:var(--amber)}
.s-changes_requested{background:var(--red-bg);color:var(--red)}
.s-approved{background:var(--green-bg);color:var(--green)}
.s-scheduled{background:var(--blue-bg);color:var(--blue)}
.s-published{background:var(--violet-bg);color:var(--violet)}
.s-planned{background:#EEF2FF;color:#4338CA}
.s-in_progress{background:var(--accent-soft);color:var(--accent)}

.empty{background:var(--white);border:1px dashed var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center;color:var(--text-light)}
.empty h3{color:var(--primary);margin-bottom:.4rem;font-size:1.2rem}
.empty .btn{margin-top:1rem}

/* calendar */
.cal{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-head{display:flex;align-items:center;gap:.6rem;padding:1rem 1.2rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cal-head h2{font-size:1.3rem;color:var(--primary);margin-right:.5rem;min-width:170px}
.legend{margin-left:auto;display:flex;gap:1rem;font-size:.8rem;color:var(--text-light);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.lg-sched{width:14px;height:10px;border-radius:3px;background:var(--accent)}
.lg-due{width:14px;height:10px;border-radius:3px;border:1.5px dashed var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);padding:.5rem .6rem;border-bottom:1px solid var(--border);background:#FBFAFE}
.cal-day{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:.4rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:#FBFAFE}
.cal-day.out .dnum{opacity:.4}
.dnum{font-family:var(--mono);font-size:.78rem;color:var(--text-light);align-self:flex-end;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-day.today .dnum{background:var(--accent);color:#fff}
.ev{border:0;text-align:left;font-size:.74rem;line-height:1.25;padding:.22rem .4rem;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block}
.ev.sched{color:#fff}
.ev.duefb{background:#fff;border:1.5px dashed var(--red);color:var(--red);font-weight:500}
.ev.duefb.met{border-color:var(--border);color:var(--text-light);text-decoration:line-through}
.ev{cursor:pointer}
.ev[draggable=true]{cursor:grab}
.ev.dragging{opacity:.4}
.ev.sched.has-prop{outline:2px dashed var(--amber);outline-offset:1px}
.ev.prop{background:repeating-linear-gradient(135deg,var(--amber-bg),var(--amber-bg) 6px,#fff 6px,#fff 12px);border:1.5px dashed var(--amber);color:var(--amber);font-weight:600}
.cal-day.drop-ok{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-hint{font-size:.82rem;color:var(--text-light);padding:.5rem 1.2rem;border-bottom:1px solid var(--border);background:#FBFAFE}
.lg-prop{width:14px;height:10px;border-radius:3px;border:1.5px dashed var(--amber);background:var(--amber-bg)}
.notice{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;background:var(--amber-bg);border:1px solid #FCD34D;color:#78350F;border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.92rem}
.notice .btn{margin-left:auto}
.prop-box{margin:1rem 0;padding:.9rem 1rem;border:1.5px dashed var(--amber);background:var(--amber-bg);border-radius:10px;color:#78350F;font-size:.92rem}
.prop-box strong{color:#78350F}
.prop-box .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.suggest{margin-top:1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--text-light)}
.suggest input{border:1px solid var(--border);border-radius:8px;padding:.35rem .5rem}
.card-prop{font-size:.78rem;font-weight:600;color:var(--amber)}
.agenda{display:none}
.ag-day{padding:.8rem 1rem;border-bottom:1px solid var(--border)}
.ag-day h4{font-family:var(--mono);font-size:.78rem;color:var(--text-light);font-weight:400;margin-bottom:.4rem}
.ag-day h4.today{color:var(--accent)}
.ag-day .ev{white-space:normal;font-size:.85rem;padding:.4rem .6rem;margin-bottom:.3rem}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(13,10,26,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--white);z-index:90;transform:translateX(100%);transition:transform .25s ease,box-shadow .25s,visibility .25s;display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;box-shadow:-20px 0 60px rgba(13,10,26,.2);visibility:visible}
.dr-head{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem}
.dr-head .camp-tag{font-size:.8rem;color:var(--text-light);display:inline-flex;align-items:center;gap:.4rem}
.dr-head .x{margin-left:auto;border:0;background:transparent;font-size:1.5rem;line-height:1;color:var(--text-light);width:36px;height:36px;border-radius:8px}
.dr-head .x:hover{background:var(--secondary)}
.dr-body{overflow-y:auto;flex:1}
.dr-preview{background:var(--primary);display:flex;align-items:center;justify-content:center;max-height:420px;overflow:hidden}
.dr-preview img,.dr-preview video{max-width:100%;max-height:420px;display:block}
.viewer{background:var(--primary)}
.vmain{display:flex;align-items:center;justify-content:center;min-height:200px}
.vmain img{max-width:100%;max-height:540px;display:block}
.vmain video{max-width:100%;max-height:540px;display:block}
.pdfv{width:100%;height:min(480px,60vh);border:0;background:#fff;display:block}
.vbar{display:flex;gap:.6rem;align-items:center;padding:.5rem .9rem;background:#1a1530;color:#EDE8FF;font-size:.85rem;flex-wrap:wrap}
.vbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar a,.vbar button{color:#EDE8FF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:.2rem .6rem;text-decoration:none;font-size:.8rem}
.vbar button.rm{color:#FCA5A5}
.vstrip{display:flex;gap:.45rem;padding:.55rem .9rem;overflow-x:auto;background:#1a1530;border-top:1px solid rgba(255,255,255,.08)}
.vthumb{flex:0 0 auto;width:68px;height:68px;border-radius:7px;border:2px solid transparent;background:#2a2346;color:#EDE8FF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.62rem;overflow:hidden;padding:0}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb.on{border-color:var(--accent)}
.vthumb b{font-size:.78rem}
.older{margin-top:1rem;font-size:.88rem}
.older summary{cursor:pointer;color:var(--text-light)}
.older ul{margin:.5rem 0 0 1.2rem}
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:1rem;text-align:center;color:var(--text-light);font-size:.9rem;margin-top:1rem;transition:background .15s,border-color .15s}
.dropzone.on{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .lnk{color:var(--accent)}
.dropzone label{display:inline-flex;gap:.35rem;align-items:center;margin-top:.5rem;font-size:.82rem}
.fcount{font-size:.8rem;color:var(--text-light);display:inline-flex;align-items:center;gap:.25rem;margin-right:.6rem}
.dr-preview .thumb{aspect-ratio:16/7}
.dr-main{padding:1.25rem}
.dr-main h2{font-size:1.5rem;color:var(--primary);line-height:1.2;margin-bottom:.6rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:1rem 0;padding:.9rem;background:var(--secondary);border-radius:10px}
.fact small{display:block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light)}
.fact div{font-weight:500;font-size:.92rem;color:var(--primary)}
.fact .overdue{color:var(--red)}
.desc{white-space:pre-wrap;color:var(--text);font-size:.95rem}
.open-link{margin:1rem 0 .25rem}
.dr-admin{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.thread{padding:1.25rem;border-top:1px solid var(--border);background:#FCFBFF}
.thread h3{font-size:1rem;color:var(--primary);margin-bottom:.8rem}
.msg{display:flex;gap:.65rem;margin-bottom:.9rem}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.msg.agency .avatar{background:var(--primary);color:#fff}
.msg-body{flex:1;min-width:0}
.msg-top{font-size:.85rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.msg-top strong{color:var(--primary)}
.msg-top time{font-family:var(--mono);font-size:.72rem;color:var(--text-light)}
.tag-agency{font-size:.68rem;background:var(--primary);color:#fff;border-radius:4px;padding:0 .35rem}
.msg-text{white-space:pre-wrap;font-size:.93rem;margin-top:.15rem;word-wrap:break-word}
.msg.event .msg-text{font-weight:500}
.msg.approved .msg-text::before{content:'✓ Approved';color:var(--green);display:block}
.msg.changes_requested .msg-text::before{content:'Changes requested';color:var(--red);display:block}
.msg.status .msg-text{color:var(--text-light);font-style:italic}
.msg-text:empty{display:none}
.msg.approved .msg-text:empty,.msg.changes_requested .msg-text:empty{display:block}
.no-msgs{color:var(--text-light);font-size:.9rem;margin-bottom:1rem}
.compose{border-top:1px solid var(--border);padding:1rem 1.25rem;background:var(--white)}
.compose .who{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;font-size:.85rem;color:var(--text-light)}
.compose .who input{border:1px solid var(--border);border-radius:8px;padding:.35rem .6rem;font-size:.88rem;flex:1;max-width:240px}
.compose textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:.65rem .8rem;min-height:78px;resize:vertical;font-size:.93rem}
.compose textarea:focus,.compose input:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.compose-actions{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap;align-items:center}
.compose-actions .grow{flex:1}
.hint{font-size:.78rem;color:var(--text-light)}
.err{color:var(--red);font-size:.85rem;margin-top:.4rem}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(13,10,26,.5);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow-y:auto}
.modal{background:var(--white);border-radius:16px;width:min(560px,100%);padding:1.5rem;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{font-size:1.3rem;color:var(--primary);margin-bottom:1rem}
.field{margin-bottom:.85rem}
.field label{display:block;font-size:.82rem;font-weight:500;color:var(--text-light);margin-bottom:.25rem}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:.55rem .7rem;font-size:.93rem;background:#fff}
.field input[type=color]{height:42px;padding:.2rem;width:80px}
.field input[type=checkbox]{width:auto;margin-right:.4rem}
.field textarea{min-height:80px;resize:vertical}
.field .help{font-size:.76rem;color:var(--text-light);margin-top:.2rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.2rem}
.modal-actions .left{margin-right:auto}
.linkbox{display:flex;gap:.5rem}
.linkbox input{flex:1;font-family:var(--mono);font-size:.8rem}

/* login / message screens */
.center{max-width:420px;margin:12vh auto;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2rem}
.center h2{color:var(--primary);margin-bottom:.4rem}
.center p{color:var(--text-light);margin-bottom:1.2rem}
.loading{text-align:center;color:var(--text-light);padding:4rem}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:.7rem 1.2rem;border-radius:10px;z-index:200;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}

@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){
  main{padding:1.2rem}
  .top-inner{padding:.8rem 1.2rem}
  .top-sep{display:none}
  .cal-grid{display:none}
  .agenda{display:block}
  .facts{grid-template-columns:1fr 1fr}
  .row2{grid-template-columns:1fr}
  .legend{margin-left:0}
  .cal-head h2{width:100%}
}
</style>

<body>
<div id="demoBar" class="demo-bar hidden"></div>
<div id="previewStrip" class="preview-strip hidden"></div>
<header class="top">
  <div class="top-inner">
    <a href="../index.html" aria-label="Mad Hat Communications"><img src="../logo.svg" alt="Mad Hat" class="top-logo"></a>
    <div class="top-sep"></div>
    <div class="top-title"><small>Content review</small><strong id="clientName">&nbsp;</strong></div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Content item"></aside>

<script>
(function(){
'use strict';

/* ───────────────────────── helpers ───────────────────────── */
const CFG = window.PORTAL_CONFIG;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { if(!s) return null; const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtD = s => s ? parseD(s).toLocaleDateString('en-IN', {day:'numeric', month:'short'}) : '—';
const fmtDLong = s => s ? parseD(s).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'}) : '—';
const fmtTime = iso => { const d = new Date(iso); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function toast(msg, ms=2600){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  const map = {
    invalid_link: 'This review link is not valid. Please check with Mad Hat for a fresh link.',
    not_allowed: 'This item is no longer available on your link.',
    note_required: 'Please write what needs to change before requesting changes.',
    name_required: 'Please add your name first.',
    name_and_comment_required: 'Please add your name and a comment.',
    portal_clients_slug_key: 'That link name is already used by another client.',
    portal_clients_slug_format: 'Link names can only use lowercase letters, numbers and hyphens.'
  };
  for (const k in map) if (m.includes(k)) return map[k];
  return m;
}

const STATUS = {
  draft:             {label:'Draft',             client:false},
  planned:           {label:'Planned',           client:true},
  in_progress:       {label:'In production',     client:true},
  in_review:         {label:'Awaiting feedback', client:true},
  changes_requested: {label:'Changes requested', client:true},
  approved:          {label:'Approved',          client:true},
  scheduled:         {label:'Scheduled',         client:true},
  published:         {label:'Live',              client:true}
};
const TYPES = ['social','video','blog','website','case_study','investor','pr','research','sales','brief','creative','document','email','other'];
const TYPE_LABEL = {social:'Social media', video:'Video', blog:'Blog', website:'Website update', case_study:'Case study', investor:'Investor relations',
  pr:'PR', research:'Research', sales:'Sales collateral', brief:'Brief', creative:'Creative', document:'Document', email:'Email', other:'Other'};
const typeLabel = t => TYPE_LABEL[t] || t;
const TYPE_ICON = {
  creative:'<path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M5 18l5-5 3 3 2-2 4 4" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 10l5-3v10l-5-3z" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  blog:'<path d="M5 4h10l4 4v12H5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11h8M8 14h8M8 17h5" stroke="currentColor" stroke-width="1.8"/>',
  document:'<path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  social:'<circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6" stroke="currentColor" stroke-width="1.8"/>',
  email:'<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  other:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.8"/>',
  website:'<rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="6.5" r=".9" fill="currentColor"/><circle cx="9" cy="6.5" r=".9" fill="currentColor"/>',
  investor:'<path d="M4 20V4M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 15l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  pr:'<path d="M3 10v4h4l6 4V6L7 10z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 9a4 4 0 010 6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  research:'<circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8"/>',
  sales:'<rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 7V5h6v2M3 12h18" fill="none" stroke="currentColor" stroke-width="1.8"/>'
};
TYPE_ICON.case_study = TYPE_ICON.document; TYPE_ICON.brief = TYPE_ICON.document;
const AWAITING = s => s === 'in_review';
const CAN_DECIDE = s => s === 'in_review' || s === 'changes_requested' || s === 'approved';

function previewOf(it){
  const p = safeUrl(it.preview_url); if (p) return p;
  const img = currentFiles(it).find(isImgF); if (img) return fileUrl(img.url);
  const u = safeUrl(it.link_url); if (!u) return '';
  let m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
  if (m) return `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`;
  if (/\.(png|jpe?g|gif|webp|avif|svg)(\?|$)/i.test(u)) return u;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(u)) return u;
  return '';
}
const isVideo = u => /\.(mp4|webm|mov)(\?|$)/i.test(u);
// ── Uploaded files (images, PDFs, videos) attached to a content piece ──
const MAX_FILE = 50 * 1024 * 1024;
const fileUrl = u => /^(https:\/\/|blob:)/i.test(String(u || '')) ? String(u) : '';
const isPdfF = a => /pdf/i.test(a.type || '') || /\.pdf(\?|$)/i.test(a.name || a.url || '');
const isImgF = a => /^image\//i.test(a.type || '') || /\.(png|jpe?g|gif|webp|avif|svg)(\?|$)/i.test(a.name || a.url || '');
const isVidF = a => /^video\//i.test(a.type || '') || /\.(mp4|webm|mov)(\?|$)/i.test(a.name || a.url || '');
const filesOf = it => Array.isArray(it.attachments) ? it.attachments.filter(a => fileUrl(a.url)) : [];
function currentFiles(it){
  const f = filesOf(it); if (!f.length) return [];
  const v = Math.max(...f.map(a => a.version || 1));
  return f.filter(a => (a.version || 1) === v);
}
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const PDF_ICON = '<path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="12" y="17" text-anchor="middle" font-size="5.5" font-weight="700" fill="currentColor" font-family="sans-serif">PDF</text>';

function dueInfo(it){
  if (!it.feedback_due || !AWAITING(it.status)) return null;
  const t = todayStr();
  if (it.feedback_due < t) return {cls:'overdue', text:`Overdue · was due ${fmtD(it.feedback_due)}`};
  if (it.feedback_due === t) return {cls:'overdue', text:'Feedback due today'};
  if (it.feedback_due <= addDays(t, 3)) return {cls:'soon', text:`Feedback by ${fmtD(it.feedback_due)}`};
  return {cls:'', text:`Feedback by ${fmtD(it.feedback_due)}`};
}

/* ───────────────────────── state ───────────────────────── */
const params = new URLSearchParams(location.search);
const configured = /^https:\/\//.test(CFG.supabaseUrl) && CFG.supabaseAnonKey && !CFG.supabaseAnonKey.startsWith('YOUR_');
const S = {
  mode: (!configured || params.has('demo')) ? 'demo' : ((params.get('c') || params.get('s')) ? 'client' : 'admin'),
  token: params.get('c'),
  slug: (params.get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g, ''),
  demoRole: 'admin',
  clients: [], clientId: null, client: null,
  campaigns: [], items: [], comments: [],
  view: ['calendar','list','approvals','manage'].includes(store.get('mh_portal_view')) ? store.get('mh_portal_view') : 'calendar', atab: 'review', canManage: false, preview: false,
  camp: 'all', quick: 'all', month: null, openId: null
};
const isAdmin = () => S.mode === 'admin' || (S.mode === 'demo' && S.demoRole === 'admin');
let sb = null;

/* ───────────────────────── backends ───────────────────────── */
// Demo: in-memory sample data so the page can be tried before Supabase is set up.
const DEMO = (() => {
  const t = todayStr(), c1 = uid(), k1 = uid(), k2 = uid();
  const db = {
    clients: [{id:c1, name:'Demo Brand Co.', token:'demo-token', slug:'demo-brand', passcode:'DEMO42'}],
    campaigns: [
      {id:k1, client_id:c1, name:'Festive Gifting', description:'Gift-box push across Instagram, Amazon and email.', color:'#9333EA', start_date:addDays(t,-6), end_date:addDays(t,14)},
      {id:k2, client_id:c1, name:'Winter Range Launch', description:'Launch of the winter range — hero film, blog and performance creatives.', color:'#0EA5E9', start_date:addDays(t,10), end_date:addDays(t,40)}
    ],
    items: [], comments: []
  };
  const it = (campaign_id, title, type, status, scheduled, due, extra={}) => {
    const row = {id:uid(), campaign_id, title, type, status, scheduled_for: scheduled==null?null:addDays(t,scheduled), feedback_due: due==null?null:addDays(t,due), link_url:'', preview_url:'', description:'', version:1, created_at:new Date().toISOString(), ...extra};
    db.items.push(row); return row;
  };
  const a = it(k1,'Gift box hero — Instagram carousel (5 frames)','creative','in_review',3,1,{description:'Five-frame carousel introducing the three gift boxes. Copy on frame 5 has the offer code.'});
  const b = it(k1,'Gifting guide — blog post','blog','changes_requested',6,-1,{description:'1,400-word guide targeting "festive gift ideas for her". Draft is in the linked doc.', link_url:'https://docs.google.com/document/d/example'});
  it(k1,'Reels cut — unboxing (15s)','video','approved',2,-2);
  it(k1,'Email: early-access announcement','email','scheduled',1,null);
  it(k1,'Amazon A+ banner refresh','creative','in_review',8,-1);
  it(k1,'Story set — countdown stickers','social','draft',9,5);
  it(k2,'Winter hero film — rough cut v1','video','in_review',14,4,{description:'60s rough cut. Music is temp; colour grade not final.'});
  it(k2,'Launch blog: caring for wool','blog','in_review',16,7);
  it(k2,'Meta ads — 6 static variants','creative','draft',12,6);
  const now = Date.now(), ago = h => new Date(now - h*3600e3).toISOString();
  db.comments.push(
    {id:uid(), item_id:b.id, author:'Mad Hat Team', body:'First draft is up — keen on your take on the intro.', kind:'comment', from_agency:true, created_at:ago(50)},
    {id:uid(), item_id:b.id, author:'Priya (Brand)', body:'Intro is too long. Can we lead with the three picks and move the story lower?', kind:'changes_requested', from_agency:false, created_at:ago(20)},
    {id:uid(), item_id:a.id, author:'Mad Hat Team', body:'Frames 1–4 final; frame 5 offer code is a placeholder.', kind:'comment', from_agency:true, created_at:ago(5)}
  );
  return db;
})();

const demoApi = {
  async listClients(){ return DEMO.clients.map(c => ({...c})); },
  async load(clientId){
    const client = DEMO.clients.find(c => c.id === clientId) || DEMO.clients[0];
    const campaigns = DEMO.campaigns.filter(c => c.client_id === client.id);
    const ids = new Set(campaigns.map(c => c.id));
    const items = DEMO.items.filter(i => ids.has(i.campaign_id));
    const iids = new Set(items.map(i => i.id));
    return {client, campaigns:campaigns.map(c=>({...c})), items:items.map(i=>({...i})), comments:DEMO.comments.filter(m => iids.has(m.item_id)).map(m=>({...m}))};
  },
  async comment(item_id, author, body, from_agency){
    if (!author.trim() || !body.trim()) throw new Error('name_and_comment_required');
    const row = {id:uid(), item_id, author, body, kind:'comment', from_agency, created_at:new Date().toISOString()};
    DEMO.comments.push(row); return row;
  },
  async decide(item_id, author, decision, note, from_agency){
    if (!author.trim()) throw new Error('name_required');
    if (decision === 'changes_requested' && !note.trim()) throw new Error('note_required');
    DEMO.items.find(i => i.id === item_id).status = decision;
    const row = {id:uid(), item_id, author, body:note || null, kind:decision, from_agency, created_at:new Date().toISOString()};
    DEMO.comments.push(row); return row;
  },
  async note(item_id, body, author, fromAgency = true){ const row = {id:uid(), item_id, author:author || CFG.agencyName, body, kind:'status', from_agency:fromAgency, created_at:new Date().toISOString()}; DEMO.comments.push(row); return row; },
  async propose(item_id, author, date){
    if (!author.trim()) throw new Error('name_required');
    const it = DEMO.items.find(i => i.id === item_id);
    if (!date || date === it.scheduled_for){
      if (!it.proposed_date) return it;
      Object.assign(it, {proposed_date:null, proposed_by:null, proposed_at:null});
      await this.note(item_id, 'Withdrew the suggested date change.', author, false); return it;
    }
    Object.assign(it, {proposed_date:date, proposed_by:author, proposed_at:new Date().toISOString()});
    await this.note(item_id, `Suggested moving the go-live date from ${fmtDLong(it.scheduled_for)} to ${fmtDLong(date)}.`, author, false); return it;
  },
  async save(table, row){
    const list = DEMO[table];
    if (row.id){ const i = list.findIndex(r => r.id === row.id); list[i] = {...list[i], ...row}; return list[i]; }
    const n = {id:uid(), created_at:new Date().toISOString(), ...row};
    if (table === 'clients') n.token = Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
    if (table === 'items') n.version = n.version || 1;
    list.push(n); return n;
  },
  async remove(table, id){
    DEMO[table] = DEMO[table].filter(r => r.id !== id);
    if (table === 'campaigns') DEMO.items = DEMO.items.filter(i => i.campaign_id !== id);
    if (table === 'clients') DEMO.campaigns = DEMO.campaigns.filter(c => c.client_id !== id);
  },
  async upload(file){ return URL.createObjectURL(file); },
  async unlink(url){}
};

const T = n => 'portal_' + n;
const chk = ({data, error}) => { if (error) throw error; return data; };
const adminApi = {
  async listClients(){ return chk(await sb.from(T('clients')).select('*').order('name')); },
  async load(clientId){
    const client = chk(await sb.from(T('clients')).select('*').eq('id', clientId).single());
    const campaigns = chk(await sb.from(T('campaigns')).select('*').eq('client_id', clientId).order('start_date', {nullsFirst:false}));
    const cids = campaigns.map(c => c.id);
    const items = cids.length ? chk(await sb.from(T('items')).select('*').in('campaign_id', cids).order('scheduled_for', {nullsFirst:false})) : [];
    const iids = items.map(i => i.id);
    const comments = iids.length ? chk(await sb.from(T('comments')).select('*').in('item_id', iids).order('created_at')) : [];
    return {client, campaigns, items, comments};
  },
  async comment(item_id, author, body){
    return chk(await sb.from(T('comments')).insert({item_id, author, body, kind:'comment', from_agency:true}).select().single());
  },
  async decide(item_id, author, decision, note){
    if (decision === 'changes_requested' && !note.trim()) throw new Error('note_required');
    chk(await sb.from(T('items')).update({status:decision}).eq('id', item_id));
    return chk(await sb.from(T('comments')).insert({item_id, author, body:note || null, kind:decision, from_agency:true}).select().single());
  },
  async note(item_id, body){
    return chk(await sb.from(T('comments')).insert({item_id, author:CFG.agencyName, body, kind:'status', from_agency:true}).select().single());
  },
  async save(table, row){
    const {id, created_at, updated_at, token, ...rest} = row;
    if (id) return chk(await sb.from(T(table)).update(rest).eq('id', id).select().single());
    return chk(await sb.from(T(table)).insert(rest).select().single());
  },
  async remove(table, id){ chk(await sb.from(T(table)).delete().eq('id', id)); },
  async upload(file){
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path = `${S.clientId}/${uid()}.${ext}`;
    const type = file.type || (ext === 'pdf' ? 'application/pdf' : 'application/octet-stream');
    chk(await sb.storage.from('portal-assets').upload(path, file, {cacheControl:'3600', upsert:false, contentType:type}));
    return sb.storage.from('portal-assets').getPublicUrl(path).data.publicUrl;
  },
  async unlink(url){
    const m = String(url).match(/\/portal-assets\/(.+)$/);
    if (m) await sb.storage.from('portal-assets').remove([decodeURIComponent(m[1])]);
  }
};

const clientApi = {
  async propose(item_id, author, date){ return chk(await sb.rpc('portal_propose_date', {p_token:S.token, p_item:item_id, p_author:author, p_date:date || null})); },
  async load(){ return chk(await sb.rpc('portal_get', {p_token:S.token})); },
  async comment(item_id, author, body){ return chk(await sb.rpc('portal_comment', {p_token:S.token, p_item:item_id, p_author:author, p_body:body})); },
  async decide(item_id, author, decision, note){ return chk(await sb.rpc('portal_decide', {p_token:S.token, p_item:item_id, p_author:author, p_decision:decision, p_note:note || null})); }
};

const api = () => S.mode === 'demo' ? demoApi : S.mode === 'admin' ? adminApi : clientApi;

// Mad Hat side: move a date directly, or accept/decline a client's suggestion.
async function adminMoveDate(it, field, date){
  if (!date || it[field] === date) return;
  const prev = it[field];
  const patch = {id:it.id, [field]:date};
  if (field === 'scheduled_for' && it.proposed_date === date) Object.assign(patch, {proposed_date:null, proposed_by:null, proposed_at:null});
  await api().save('items', patch);
  await api().note(it.id, field === 'scheduled_for'
    ? `Go-live moved from ${fmtDLong(prev)} to ${fmtDLong(date)}.` + (patch.proposed_date === null ? ' (Matches the suggested date.)' : '')
    : `Feedback deadline moved to ${fmtDLong(date)}.`);
}
async function adminResolve(it, accept){
  if (!it.proposed_date) return;
  const from = it.scheduled_for, to = it.proposed_date, who = it.proposed_by || 'the client';
  const patch = {id:it.id, proposed_date:null, proposed_by:null, proposed_at:null};
  if (accept) patch.scheduled_for = to;
  await api().save('items', patch);
  await api().note(it.id, accept
    ? `Accepted ${who}’s suggestion: go-live moved from ${fmtDLong(from)} to ${fmtDLong(to)}.`
    : `Kept go-live on ${fmtDLong(from)}; ${who}’s suggested ${fmtDLong(to)} was declined.`);
}
// Mad Hat side: attach images / PDFs / videos to a piece (optionally as a new version).
async function uploadFiles(it, fileList, newVersion){
  const ok = f => /^image\//.test(f.type) || /^video\//.test(f.type) || f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  const list = [...fileList].filter(ok);
  if (!list.length) throw new Error('Only images, PDFs and videos can be uploaded.');
  const big = list.find(f => f.size > MAX_FILE);
  if (big) throw new Error(`${big.name} is over 50 MB. Share it as a Drive link instead.`);
  const version = newVersion ? (it.version || 1) + 1 : (it.version || 1);
  const added = [];
  for (let k = 0; k < list.length; k++){
    const f = list[k];
    toast(`Uploading ${k + 1} of ${list.length}: ${f.name}`, 120000);
    const url = await api().upload(f);
    added.push({url, name:f.name, type:f.type || (/\.pdf$/i.test(f.name) ? 'application/pdf' : ''), size:f.size, version, uploaded_at:new Date().toISOString()});
  }
  const patch = {id:it.id, attachments:[...filesOf(it), ...added]};
  if (newVersion) Object.assign(patch, {version, status:'in_review'});
  await api().save('items', patch);
  const names = added.map(a => a.name).join(', ');
  await api().note(it.id, newVersion
    ? `Version ${version} uploaded for review: ${names}.`
    : `Added ${added.length} file${added.length === 1 ? '' : 's'} for review: ${names}.`);
  toast(newVersion ? `Uploaded as v${version} and sent for review` : `${added.length} file${added.length === 1 ? '' : 's'} uploaded`);
}
async function removeFile(it, url){
  const f = filesOf(it).find(a => a.url === url); if (!f) return;
  await api().save('items', {id:it.id, attachments:filesOf(it).filter(a => a.url !== url)});
  await api().note(it.id, `Removed file: ${f.name}.`);
  try { await api().unlink(url); } catch(_){}
}

// Client side: ask for a name once, then suggest a date.
function ensureName(){
  const saved = (store.get('mh_portal_name') || '').trim();
  if (saved) return Promise.resolve(saved);
  return new Promise(resolve => {
    modal('Your name', `<p class="hint" style="margin-bottom:.8rem">So Mad Hat knows who suggested the change.</p>
      <div class="field"><label>Name</label><input name="who" required maxlength="80" placeholder="e.g. Priya, Marketing"></div>`, {
      submitLabel:'Continue',
      onSubmit: async fd => { const n = val(fd,'who'); store.set('mh_portal_name', n); resolve(n); }
    });
  });
}
async function clientPropose(it, date){
  const who = await ensureName();
  await api().propose(it.id, who, date);
  await refresh(); render();
  toast(date && date !== it.scheduled_for ? `Suggested ${fmtD(date)}. Mad Hat will confirm before it changes.` : 'Suggestion withdrawn.');
}

/* ───────────────────────── loading ───────────────────────── */
async function refresh(){
  let data;
  if (S.mode === 'client') data = await clientApi.load();
  else data = await api().load(S.clientId);
  S.client = data.client; S.campaigns = data.campaigns || []; S.items = data.items || []; S.comments = data.comments || [];
  if (!isAdmin()) S.items = S.items.filter(i => i.status !== 'draft');
  if (S.camp !== 'all' && !S.campaigns.some(c => c.id === S.camp)) S.camp = 'all';
}

async function loadClients(){
  S.clients = await api().listClients();
  const saved = store.get('mh_portal_client');
  if (!S.clients.some(c => c.id === S.clientId)) S.clientId = (S.clients.find(c => c.id === saved) || S.clients[0] || {}).id || null;
}

async function boot(){
  if (S.mode === 'demo'){
    const bar = $('#demoBar'); bar.classList.remove('hidden'); renderDemoBar();
    await loadClients(); await refresh(); render(); return;
  }
  await loadSupabase();
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  if (S.mode === 'client'){
    if (S.slug){
      // Show the friendly address (madhatcomm.in/portal/<slug>) in the browser bar.
      try { history.replaceState(null, '', location.pathname.replace(/[^/]*$/, '') + S.slug); } catch(e){}
      // Signed in as Mad Hat in this browser? Open the admin view for this client.
      const {data:{session}} = await sb.auth.getSession();
      if (session){
        const {data:own} = await sb.from(T('clients')).select('*').eq('slug', S.slug).maybeSingle();
        if (own){ S.canManage = true; S.mode = 'admin'; S.clientId = own.id; store.set('mh_portal_client', own.id); return enterAdmin(); }
      }
      S.token = store.get('mh_portal_key_' + S.slug);
      if (!S.token) return renderUnlock();
    }
    try { await refresh(); render(); }
    catch(e){
      if (S.slug){ store.set('mh_portal_key_' + S.slug, ''); S.token = null; return renderUnlock(true); }
      showMessage('Link not recognised', errMsg(e));
    }
    return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return renderLogin();
  await enterAdmin();
}

async function enterAdmin(){
  S.canManage = true;
  try {
    await loadClients();
    if (S.clientId) await refresh(); else { S.client = null; S.campaigns = S.items = S.comments = []; }
    render();
  } catch(e){
    showMessage('Could not load', errMsg(e) + ' — is your email listed in portal_admins?', true);
  }
}

function loadSupabase(){
  return new Promise((res, rej) => {
    if (window.supabase) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = res; s.onerror = () => rej(new Error('Could not load Supabase library'));
    document.head.appendChild(s);
  });
}

function campOf(id){ return S.campaigns.find(c => c.id === id) || {name:'—', color:'#9333EA'}; }
function commentsOf(id){ return S.comments.filter(m => m.item_id === id); }

function filtered(){
  const t = todayStr();
  return S.items.filter(i => {
    if (S.camp !== 'all' && i.campaign_id !== S.camp) return false;
    if (S.quick === 'awaiting') return AWAITING(i.status);
    if (S.quick === 'week') return AWAITING(i.status) && i.feedback_due && i.feedback_due >= t && i.feedback_due <= addDays(t, 7);
    if (S.quick === 'overdue') return AWAITING(i.status) && i.feedback_due && i.feedback_due < t;
    if (S.quick === 'approved') return ['approved','scheduled','published'].includes(i.status);
    if (S.quick === 'changes') return i.status === 'changes_requested';
    if (S.quick === 'draft') return i.status === 'draft';
    if (S.quick === 'proposals') return !!i.proposed_date;
    return true;
  });
}

  renderTop();
  const app = $('#app');
  if (isAdmin() && !S.clientId){
    app.innerHTML = `<div class="empty"><h3>No clients yet</h3><p>Add your first client to get their private review link.</p><button class="btn btn-primary" id="e1">+ New client</button></div>`;

  }
  if (S.view === 'manage' && !isAdmin()) S.view = 'calendar';
  const admin = isAdmin();
  const scope = S.items.filter(i => S.camp === 'all' || i.campaign_id === S.camp);
  const t = todayStr();
  const n = {
    awaiting: scope.filter(i => AWAITING(i.status)).length,
    week: scope.filter(i => AWAITING(i.status) && i.feedback_due && i.feedback_due >= t && i.feedback_due <= addDays(t,7)).length,
    overdue: scope.filter(i => AWAITING(i.status) && i.feedback_due && i.feedback_due < t).length,
    approved: scope.filter(i => ['approved','scheduled','published'].includes(i.status)).length
  };
  const nReview = S.items.filter(i => AWAITING(i.status)).length;
  const nAction = S.items.filter(i => i.proposed_date || i.status === 'changes_requested').length;
  const stat = (k, num, label, warn) => `<button class="stat ${S.quick===k?'active':''} ${warn && num ? 'warn':''}" data-quick="${k}"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></button>`;

  const statusOpts = [['all','All content'],['awaiting','Awaiting feedback'],['changes','Changes requested'],['approved','Approved & live'],['week','Feedback due this week'],['overdue','Overdue feedback'],['proposals','Suggested date changes']];
  if (admin) statusOpts.push(['draft','Drafts (hidden from client)']);

  const notice = nProp && S.view !== 'manage' ? `<div class="notice"><span>${admin
      ? `<strong>${esc(S.client?.name || 'The client')} suggested ${nProp} date change${nProp===1?'':'s'}.</strong> Nothing moves until you accept.`
      : `<strong>You've suggested ${nProp} date change${nProp===1?'':'s'}.</strong> They stay highlighted until Mad Hat confirms.`}</span>
      <button class="btn btn-sm" id="seeProps">${admin ? 'Review in Manage' : (S.quick === 'proposals' ? 'Show everything' : 'Review')}</button></div>` : '';

  const tab = (v, label, extra = '') => `<button class="tab ${v==='manage'?'manage':''} ${S.view===v?'active':''}" data-tab="${v}">${label}${extra}</button>`;
  const tabs = `<nav class="tabs" aria-label="Views">
      ${tab('calendar','Calendar')}${tab('list','Campaigns')}${tab('approvals','Approvals', nReview ? `<span class="n">${nReview}</span>` : '')}
      ${admin ? tab('manage','Manage', nAction ? `<span class="n">${nAction}</span>` : '') : ''}
    </nav>`;
  const filters = S.view === 'manage' ? '' : `
    <section class="stats">
      ${stat('awaiting', n.awaiting, admin ? 'Awaiting client feedback' : 'Awaiting your feedback')}
      ${stat('week', n.week, 'Feedback due in 7 days')}
      ${stat('overdue', n.overdue, 'Feedback overdue', true)}
      ${stat('approved', n.approved, 'Approved')}
    </section>
    <section class="toolbar">
      <div class="chips">
        <button class="chip ${S.camp==='all'?'active':''}" data-camp="all">All campaigns</button>
        ${S.campaigns.map(c => `<button class="chip ${S.camp===c.id?'active':''}" data-camp="${esc(c.id)}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('')}
      </div>
      <div class="spacer"></div>
      ${S.view === 'approvals' ? '' : `<select class="plain" id="quickSel" aria-label="Filter">${statusOpts.map(([v,l]) => `<option value="${v}" ${S.quick===v?'selected':''}>${l}</option>`).join('')}</select>`}
    </section>`;

  app.innerHTML = `${tabs}${notice}${filters}<section id="view"></section>`;

  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  app.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
    const k = b.dataset.quick; S.quick = S.quick === k ? 'all' : k;

  if ($('#quickSel')) $('#quickSel').onchange = e => { S.quick = e.target.value; render(); };

  if (S.openId) renderDrawer();

  else if (p) inner = `<img src="${esc(p)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'Preview unavailable'}))">`;
  else if (currentFiles(it).some(isPdfF)){ const n = currentFiles(it).filter(isPdfF).length; inner = `<div class="ph"><svg viewBox="0 0 24 24">${PDF_ICON}</svg>${n} PDF${n===1?'':'s'} to review</div>`; }
  else inner = `<div class="ph"><svg viewBox="0 0 24 24">${TYPE_ICON[it.type] || TYPE_ICON.other}</svg>${esc(typeLabel(it.type))}</div>`;

/* ── calendar view ── */
function renderCalendar(){
  if (!S.month){ const d = new Date(); S.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  const m = S.month, y = m.getFullYear(), mo = m.getMonth(), t = todayStr();
  const items = filtered();
  const start = new Date(y, mo, 1); start.setDate(1 - ((start.getDay() + 6) % 7)); // Monday start
  const last = new Date(y, mo + 1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - ((last.getDay() + 6) % 7)));

  const admin = isAdmin();
  const eventsOn = ds => {
    const out = [];
    items.forEach(i => {
      if (i.feedback_due === ds && ['in_review','changes_requested','approved','scheduled','published'].includes(i.status)) out.push({i, kind:'due'});
      if (i.scheduled_for === ds) out.push({i, kind:'sched'});
      if (i.proposed_date === ds) out.push({i, kind:'prop'});
    });
    const rank = {due:0, prop:1, sched:2};
    return out.sort((a,b) => rank[a.kind] - rank[b.kind]);
  };
  // Who may drag what: Mad Hat moves go-live and feedback dates directly;
  // the client drags go-live (or their own suggestion) to suggest a new date.
  const canDrag = (i, kind) => i.status !== 'published' && (admin ? kind !== 'prop' : kind !== 'due');
  const evHtml = ({i, kind}) => {
    const c = campOf(i.campaign_id);
    const drag = canDrag(i, kind) ? `draggable="true" data-drag="${esc(i.id)}" data-kind="${kind}"` : '';
    const attrs = `role="button" tabindex="0" data-open="${esc(i.id)}" ${drag}`;
    if (kind === 'sched') return `<div class="ev sched ${i.proposed_date ? 'has-prop' : ''}" ${attrs} style="background:${esc(c.color)}" title="${esc(typeLabel(i.type))}: ${esc(i.title)} (goes live)${i.proposed_date ? ' · move to ' + fmtD(i.proposed_date) + ' suggested' : ''}">${esc(i.title)}</div>`;
    if (kind === 'prop') return `<div class="ev prop" ${attrs} title="Suggested by ${esc(i.proposed_by || 'client')}: move from ${fmtD(i.scheduled_for)} to here">Suggested: ${esc(i.title)}</div>`;
    const met = !AWAITING(i.status);
    return `<div class="ev duefb ${met ? 'met' : ''}" ${attrs} title="Feedback due: ${esc(i.title)}">Feedback: ${esc(i.title)}</div>`;
  };

  let cells = '', agenda = '';
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const ds = ymd(d), evs = eventsOn(ds), out = d.getMonth() !== mo;
    cells += `<div class="cal-day ${out?'out':''} ${ds===t?'today':''}" data-day="${ds}"><span class="dnum">${d.getDate()}</span>${evs.map(evHtml).join('')}</div>`;
    if (!out && evs.length) agenda += `<div class="ag-day"><h4 class="${ds===t?'today':''}">${fmtDLong(ds)}${ds===t?' · Today':''}</h4>${evs.map(evHtml).join('')}</div>`;
  }
  $('#view').innerHTML = `<div class="cal">
    <div class="cal-head">
      <h2>${m.toLocaleDateString('en-IN', {month:'long', year:'numeric'})}</h2>
      <button class="btn btn-sm" id="prevM" aria-label="Previous month">‹</button>
      <button class="btn btn-sm" id="todayM">Today</button>
      <button class="btn btn-sm" id="nextM" aria-label="Next month">›</button>
      <div class="legend"><span><i class="lg-sched"></i>Goes live</span><span><i class="lg-due"></i>Feedback due</span><span><i class="lg-prop"></i>Suggested new date</span></div>
    </div>
    <div class="cal-hint">${admin
      ? 'Drag a piece to move its go-live date, or a feedback box to move the deadline. Suggestions from the client show striped. Open one to accept or decline it.'
      : 'Drag a piece to another day to suggest a new go-live date. It shows striped until Mad Hat confirms; nothing moves until then.'}</div>
    <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div class="agenda">${agenda || '<div class="ag-day">Nothing scheduled this month.</div>'}</div>
  </div>`;
  $('#prevM').onclick = () => { S.month = new Date(y, mo - 1, 1); renderCalendar(); };
  $('#nextM').onclick = () => { S.month = new Date(y, mo + 1, 1); renderCalendar(); };
  $('#todayM').onclick = () => { S.month = null; renderCalendar(); };
  const view = $('#view');
  view.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => openDrawer(b.dataset.open);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDrawer(b.dataset.open); } };
  });
  let dragged = null;
  view.querySelectorAll('[data-drag]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = {id:el.dataset.drag, kind:el.dataset.kind};
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', el.dataset.drag); } catch(_){}
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragged = null; view.querySelectorAll('.drop-ok').forEach(x => x.classList.remove('drop-ok')); });
  });
  view.querySelectorAll('.cal-day[data-day]').forEach(cell => {
    cell.addEventListener('dragover', e => { if (!dragged) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; cell.classList.add('drop-ok'); });
    cell.addEventListener('dragleave', e => { if (!cell.contains(e.relatedTarget)) cell.classList.remove('drop-ok'); });
    cell.addEventListener('drop', async e => {
      e.preventDefault(); cell.classList.remove('drop-ok');
      if (!dragged) return;
      const {id, kind} = dragged; dragged = null;
      const it = S.items.find(i => i.id === id); const day = cell.dataset.day;
      await new Promise(r => setTimeout(r, 60)); // let the browser finish the drag before the calendar redraws
      if (!it) return;
      try {
        if (admin){
          const field = kind === 'due' ? 'feedback_due' : 'scheduled_for';
          if (it[field] === day) return;
          await adminMoveDate(it, field, day);
          await refresh(); render();
          toast(kind === 'due' ? `Feedback deadline moved to ${fmtD(day)}` : `Go-live moved to ${fmtD(day)}`);
        } else {
          if (day === (kind === 'prop' ? it.proposed_date : it.scheduled_for)) return;
          await clientPropose(it, day);
        }
      } catch(err){ toast(errMsg(err)); }
    });
  });
}

  return `<div class="viewer">

      <div class="vbar"><span class="nm">${files.length > 1 ? `${idx + 1} of ${files.length} · ` : ''}${esc(f.name)}${f.size ? ` · ${fmtSize(f.size)}` : ''}${(it.version || 1) > 1 ? ` · v${f.version || 1}` : ''}</span>

        ${isAdmin() ? `<button class="rm" data-rmfile="${u}">Remove</button>` : ''}</div>
      ${strip}
    </div>`;
}

            <input type="date" id="propDate" value="${esc(it.proposed_date || it.scheduled_for || '')}"><button class="btn btn-sm" id="propSend">Suggest</button></div>` : ''}
        ${it.description ? `<div class="desc" style="margin-top:1rem">${esc(it.description)}</div>` : ''}
        ${link ? `<div class="open-link"><a class="btn btn-dark" href="${esc(link)}" target="_blank" rel="noopener">Open file ↗</a></div>` : ''}
        ${S._older || ''}
        ${isAdmin() ? `<div class="dr-admin">
            <button class="btn btn-sm" id="drEdit">Edit</button>
            <select class="plain" id="drStatus" style="padding:.3rem .5rem;font-size:.82rem">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${k===it.status?'selected':''}>${v.label}${k==='draft'?' (hidden)':''}</option>`).join('')}</select>
            <button class="btn btn-sm" id="drVersion">Mark as new version</button>
          </div>
          <div class="dropzone" id="drDrop">
            <strong>Drop images or PDFs here</strong> or <button class="lnk" id="drBrowse">browse</button> · up to 50 MB each
            <div><label><input type="checkbox" id="drNewVer"> Upload as a new version (v${(it.version || 1) + 1}) and send it for review</label></div>
            <input type="file" id="drFiles" multiple accept="image/*,application/pdf,video/mp4,video/quicktime,video/webm" hidden>
          </div>` : ''}
      </div>
      <div class="thread">
        <h3>Feedback &amp; approvals</h3>
        ${msgs.length ? msgs.map(msgHtml).join('') : '<p class="no-msgs">No feedback yet.</p>'}
      </div>
    </div>
    <div class="compose">
      ${isAdmin() ? '' : `<div class="who">Your name <input id="cmpName" value="${esc(myName)}" placeholder="e.g. Priya, Marketing" maxlength="80"></div>`}
      <textarea id="cmpText" placeholder="${isAdmin() ? 'Reply to the client…' : 'Write feedback, or add a note with your approval…'}" maxlength="5000"></textarea>
      <div class="compose-actions">
        <button class="btn" id="cmpSend">Comment</button>
        <span class="grow"></span>
        ${CAN_DECIDE(it.status) && !isAdmin() ? `
          <button class="btn btn-changes" id="cmpChanges" ${it.status==='changes_requested'?'disabled':''}>Request changes</button>
          <button class="btn btn-approve" id="cmpApprove" ${it.status==='approved'?'disabled':''}>✓ Approve</button>` : ''}
      </div>
      ${CAN_DECIDE(it.status) && !isAdmin() ? '<div class="hint" style="margin-top:.4rem">To request changes, describe them in the box first.</div>' : ''}
      <div class="err" id="cmpErr"></div>
    </div>`;
  if (draft) $('#cmpText').value = draft;
  dr.classList.add('open'); dr.setAttribute('aria-hidden','false'); $('#scrim').classList.add('open');
  const th = dr.querySelector('.dr-body'); th.scrollTop = th.scrollHeight > 900 && msgs.length > 3 ? th.scrollHeight : 0;
  $('#drClose').onclick = closeDrawer;

  const author = () => {
    if (isAdmin()) return CFG.agencyName;
    const n = $('#cmpName').value.trim(); if (n) store.set('mh_portal_name', n); return n;
  };
  const run = async (btn, fn) => {
    $('#cmpErr').textContent = ''; btn.disabled = true;
    try { await fn(); $('#cmpText').value = ''; await refresh(); render(); }
    catch(e){ $('#cmpErr').textContent = errMsg(e); btn.disabled = false; }
  };
  $('#cmpSend').onclick = e => run(e.currentTarget, async () => {
    const body = $('#cmpText').value.trim(), a = author();
    if (!a) throw new Error('name_required');
    if (!body) throw new Error('Write a comment first.');
    await api().comment(it.id, a, body, isAdmin());
  });
  if ($('#cmpApprove')) $('#cmpApprove').onclick = e => run(e.currentTarget, async () => {
    const a = author(); if (!a) throw new Error('name_required');
    await api().decide(it.id, a, 'approved', $('#cmpText').value.trim(), false);
    toast('Approved — thank you!');
  });
  if ($('#cmpChanges')) $('#cmpChanges').onclick = e => run(e.currentTarget, async () => {
    const a = author(); if (!a) throw new Error('name_required');
    const note = $('#cmpText').value.trim();
    if (!note) { $('#cmpText').focus(); throw new Error('note_required'); }
    await api().decide(it.id, a, 'changes_requested', note, false);
    toast('Changes requested — we’re on it.');
  });
  const guard = fn => async e => { const b = e.currentTarget; b.disabled = true; try { await fn(); } catch(err){ toast(errMsg(err)); b.disabled = false; } };
  if ($('#propAccept')) $('#propAccept').onclick = guard(async () => { await adminResolve(it, true); await refresh(); render(); toast('New date accepted'); });
  if ($('#propDecline')) $('#propDecline').onclick = guard(async () => { await adminResolve(it, false); await refresh(); render(); toast('Kept the current date'); });
  if ($('#propWithdraw')) $('#propWithdraw').onclick = guard(() => clientPropose(it, null));
  if ($('#propSend')) $('#propSend').onclick = guard(async () => {
    const v = $('#propDate').value;
    if (!v) throw new Error('Pick a date first.');
    if (v === (it.proposed_date || it.scheduled_for)) throw new Error('That\u2019s already the date.');
    await clientPropose(it, v);
  });
  dr.querySelectorAll('[data-fidx]').forEach(b => b.onclick = () => { S.fileIdx = +b.dataset.fidx; renderDrawer(); });
  dr.querySelectorAll('[data-rmfile]').forEach(b => b.onclick = guard(async () => {
    if (b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Click again to remove'; b.disabled = false; return; }
    await removeFile(it, b.dataset.rmfile); S.fileIdx = 0; await refresh(); render(); toast('File removed');
  }));
  if (isAdmin()){
    const zone = $('#drDrop'), inp = $('#drFiles');
    const send = async files => {
      zone.classList.remove('on');
      try { await uploadFiles(it, files, $('#drNewVer').checked); S.fileIdx = 0; await refresh(); render(); }
      catch(err){ toast(errMsg(err), 5000); }
    };
    $('#drBrowse').onclick = () => inp.click();
    inp.onchange = () => { if (inp.files.length) send(inp.files); };
    zone.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')){ e.preventDefault(); zone.classList.add('on'); } });
    zone.addEventListener('dragleave', () => zone.classList.remove('on'));
    zone.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) send(e.dataTransfer.files); });
    $('#drEdit').onclick = () => itemForm(it);
    $('#drStatus').onchange = async e => {
      const s = e.target.value;
      try { await api().save('items', {id:it.id, status:s}); await api().note(it.id, `Status set to “${STATUS[s].label}”.`); await refresh(); render(); }
      catch(err){ toast(errMsg(err)); }
    };
    $('#drVersion').onclick = async () => {
      try {
        const v = (it.version || 1) + 1;
        await api().save('items', {id:it.id, version:v, status:'in_review'});
        await api().note(it.id, `Version ${v} uploaded — ready for review.`);
        await refresh(); render(); toast(`Marked as v${v}, awaiting feedback`);
      } catch(err){ toast(errMsg(err)); }
    };
  }
}

/* ───────────────────────── admin forms ───────────────────────── */
function modal(title, bodyHtml, {onSubmit, onDelete, submitLabel='Save'} = {}){
  const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = `<form class="modal" novalidate><h3>${esc(title)}</h3>${bodyHtml}
    <div class="err" data-err></div>
    <div class="modal-actions">
      ${onDelete ? '<button type="button" class="btn btn-danger left" data-del>Delete</button>' : ''}
      <button type="button" class="btn" data-cancel>Cancel</button>
      ${onSubmit ? `<button class="btn btn-primary" data-submit>${esc(submitLabel)}</button>` : ''}
    </div></form>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form'), close = () => wrap.remove();
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  form.querySelector('[data-cancel]').onclick = close;
  let armed = false;
  if (onDelete) form.querySelector('[data-del]').onclick = async e => {
    const b = e.currentTarget;
    if (!armed){ armed = true; b.textContent = 'Click again to delete'; return; }
    try { await onDelete(); close(); } catch(err){ form.querySelector('[data-err]').textContent = errMsg(err); }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const req = [...form.querySelectorAll('[required]')].find(x => !x.value.trim());
    if (req){ form.querySelector('[data-err]').textContent = 'Please fill in the required fields.'; req.focus(); return; }
    const btn = form.querySelector('[data-submit]'); btn.disabled = true;
    try { await onSubmit(new FormData(form), form); close(); }
    catch(err){ form.querySelector('[data-err]').textContent = errMsg(err); btn.disabled = false; }
  };
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
  return form;
}
const val = (fd, k) => { const v = (fd.get(k) || '').toString().trim(); return v || null; };
const portalBase = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const clientLink = c => c.slug ? portalBase() + c.slug : `${portalBase()}?c=${encodeURIComponent(c.token)}`;
const slugify = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
function newPasscode(){
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', a = new Uint32Array(6);
  crypto.getRandomValues(a); return [...a].map(n => abc[n % abc.length]).join('');
}

function clientForm(c){
  const f = modal(c ? 'Edit client' : 'New client', `
    <div class="field"><label>Client name *</label><input name="name" required value="${esc(c?.name)}" placeholder="e.g. Empressa"></div>
    <div class="field"><label>Link name *</label><input name="slug" required value="${esc(c?.slug || '')}" placeholder="e.g. empressa" style="font-family:var(--mono)">
      <div class="help" data-slughelp></div></div>
    <div class="field"><label>Passcode *</label>
      <div class="linkbox"><input name="passcode" required value="${esc(c?.passcode || newPasscode())}" style="font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase" maxlength="40"><button type="button" class="btn" data-regen>New code</button></div>
      <div class="help">${c ? 'Changing the passcode signs out everyone using the old one.' : 'The client enters this once per device.'}</div></div>`, {
    onSubmit: async fd => {
      const slug = slugify(val(fd,'slug'));
      if (!slug) throw new Error('portal_clients_slug_format');
      const passcode = (val(fd,'passcode') || '').toUpperCase().replace(/\s+/g, '');
      if (passcode.length < 6) throw new Error('Passcode must be at least 6 characters.');
      const row = await api().save('clients', {...(c ? {id:c.id} : {}), name:val(fd,'name'), slug, passcode});
      S.clientId = row.id; store.set('mh_portal_client', row.id);
      await loadClients(); await refresh(); render();
      if (!c) shareDialog();
    },
    onDelete: c ? async () => {
      await api().remove('clients', c.id); S.clientId = null; closeDrawer();
      await loadClients(); if (S.clientId) await refresh(); render(); toast('Client deleted');
    } : null
  });
  const nameIn = f.querySelector('[name=name]'), slugIn = f.querySelector('[name=slug]'), help = f.querySelector('[data-slughelp]');
  let slugTouched = !!c?.slug;
  const showSlug = () => { help.textContent = portalBase() + (slugify(slugIn.value) || '…'); };
  if (!slugTouched) slugIn.value = slugify(nameIn.value);
  nameIn.addEventListener('input', () => { if (!slugTouched){ slugIn.value = slugify(nameIn.value); showSlug(); } });
  slugIn.addEventListener('input', () => { slugTouched = true; showSlug(); });
  slugIn.addEventListener('blur', () => { slugIn.value = slugify(slugIn.value); showSlug(); });
  f.querySelector('[data-regen]').onclick = () => { f.querySelector('[name=passcode]').value = newPasscode(); };
  showSlug();
}

function shareDialog(){
  const c = S.clients.find(x => x.id === S.clientId); if (!c) return;
  const url = clientLink(c), code = c.passcode || '';
  const message = c.slug && code
    ? `Here's where you can review and approve our work for ${c.name}:\n${url}\nPasscode: ${code}`
    : url;
  const f = modal(`Review link for ${c.name}`, c.slug && code ? `
    <p class="hint" style="margin-bottom:.8rem;font-size:.9rem">Send both to the client's team. With them, anyone can view this client's content (not drafts), comment and approve.</p>
    <div class="field"><label>Link</label><div class="linkbox"><input readonly value="${esc(url)}"></div></div>
    <div class="field"><label>Passcode</label><div class="linkbox"><input readonly value="${esc(code)}" style="letter-spacing:.12em"></div></div>
    <div class="field"><label>Message to send</label><textarea readonly id="shareMsg" style="min-height:90px;font-size:.88rem">${esc(message)}</textarea></div>
    <button type="button" class="btn btn-primary" id="copyMsg">Copy message</button>
    <p class="hint" style="margin-top:.8rem"><a href="${esc(url)}" target="_blank" rel="noopener">Open as the client sees it ↗</a> (use a private window to see the passcode screen)</p>` : `
    <p class="hint" style="margin-bottom:.8rem;font-size:.9rem">This client has no link name and passcode yet. Use <strong>Edit client</strong> to set them. Meanwhile, this private link works on its own:</p>
    <div class="linkbox"><input readonly value="${esc(url)}" id="shareMsg"></div>
    <button type="button" class="btn btn-primary" id="copyMsg" style="margin-top:.6rem">Copy link</button>`);
  f.querySelector('#copyMsg').onclick = async () => {
    try { await navigator.clipboard.writeText(message); toast('Copied'); }
    catch(e){ const t = f.querySelector('#shareMsg'); t.select(); try { document.execCommand('copy'); toast('Copied'); } catch(_){ toast('Select the text and copy it'); } }
  };
}

function campaignForm(c){
  modal(c ? 'Edit campaign' : 'New campaign', `
    <div class="field"><label>Campaign name *</label><input name="name" required value="${esc(c?.name)}" placeholder="e.g. Festive Gifting 2026"></div>
    <div class="field"><label>Description</label><textarea name="description" placeholder="Goal, channels, key message">${esc(c?.description)}</textarea></div>
    <div class="row2">
      <div class="field"><label>Starts</label><input type="date" name="start_date" value="${esc(c?.start_date)}"></div>
      <div class="field"><label>Ends</label><input type="date" name="end_date" value="${esc(c?.end_date)}"></div>
    </div>
    <div class="field"><label>Colour (used on cards and the calendar)</label><input type="color" name="color" value="${esc(c?.color || '#9333EA')}"></div>`, {
    onSubmit: async fd => {
      await api().save('campaigns', {...(c ? {id:c.id} : {client_id:S.clientId}), name:val(fd,'name'), description:val(fd,'description'), start_date:val(fd,'start_date'), end_date:val(fd,'end_date'), color:val(fd,'color') || '#9333EA'});
      await refresh(); render();
    },
    onDelete: c ? async () => { await api().remove('campaigns', c.id); closeDrawer(); await refresh(); render(); toast('Campaign deleted'); } : null
  });
}

function itemForm(it){
  const campDefault = it?.campaign_id || (S.camp !== 'all' ? S.camp : S.campaigns[0]?.id);
  const f = modal(it ? 'Edit content' : 'Add content for review', `
    <div class="field"><label>Title *</label><input name="title" required value="${esc(it?.title)}" placeholder="e.g. Hero carousel — Instagram"></div>
    <div class="row2">
      <div class="field"><label>Campaign *</label><select name="campaign_id" required>${S.campaigns.map(c => `<option value="${esc(c.id)}" ${c.id===campDefault?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Type</label><select name="type">${TYPES.map(t => `<option value="${t}" ${t===(it?.type||'social')?'selected':''}>${typeLabel(t)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Link to the file</label><input type="url" name="link_url" value="${esc(it?.link_url)}" placeholder="Google Drive / Docs / Figma / YouTube link">
      <div class="help">Drive files shared as "anyone with the link" and YouTube links get a preview automatically.</div></div>
    <div class="field"><label>Images or PDFs for review</label>
      <input type="file" name="files" multiple accept="image/*,application/pdf,video/mp4,video/quicktime,video/webm">
      <div class="help" data-up>${it && filesOf(it).length ? `${currentFiles(it).length} file${currentFiles(it).length===1?'':'s'} attached now. New files are added to them; open the piece to remove or replace files.` : 'Up to 50 MB each. You can add more later from the piece itself.'}</div>
      <input type="url" name="preview_url" value="${esc(it?.preview_url)}" placeholder="Cover image URL (optional)" style="margin-top:.4rem"></div>
    <div class="field"><label>Notes for the client</label><textarea name="description" placeholder="What to look at, what's final, what's placeholder">${esc(it?.description)}</textarea></div>
    <div class="row2">
      <div class="field"><label>Goes live on</label><input type="date" name="scheduled_for" value="${esc(it?.scheduled_for)}"></div>
      <div class="field"><label>Feedback needed by</label><input type="date" name="feedback_due" value="${esc(it?.feedback_due)}"></div>
    </div>
    <div class="field"><label>Status</label><select name="status">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${k===(it?.status||'in_review')?'selected':''}>${v.label}${k==='draft'?' (hidden from client)':''}</option>`).join('')}</select></div>`, {
    submitLabel: it ? 'Save' : 'Add',
    onSubmit: async (fd, form) => {
      const preview = val(fd,'preview_url');
      const files = form.querySelector('[name=files]').files;
      const big = [...files].find(f => f.size > MAX_FILE);
      if (big) throw new Error(`${big.name} is over 50 MB. Share it as a Drive link instead.`);
      const link = val(fd,'link_url');
      if (link && !safeUrl(link)) throw new Error('Links must start with https://');
      if (preview && !safeUrl(preview) && !preview.startsWith('blob:')) throw new Error('Preview URL must start with https://');
      const status = val(fd,'status');
      const row = await api().save('items', {...(it ? {id:it.id} : {}), title:val(fd,'title'), campaign_id:val(fd,'campaign_id'), type:val(fd,'type'), link_url:link, preview_url:preview, description:val(fd,'description'), scheduled_for:val(fd,'scheduled_for'), feedback_due:val(fd,'feedback_due'), status});
      if (it && it.status !== status) await api().note(it.id, `Status set to “${STATUS[status].label}”.`);
      if (files.length){ form.querySelector('[data-up]').textContent = 'Uploading…'; await uploadFiles({...row, attachments: it ? filesOf(it) : []}, files, false); }
      await refresh(); render();
      if (!it) toast(status === 'draft' ? 'Added as a draft (client can’t see it yet)' : 'Added — the client can see it now');
      return row;
    },
    onDelete: it ? async () => { await api().remove('items', it.id); closeDrawer(); await refresh(); render(); toast('Deleted'); } : null
  });
}

boot().catch(e => showMessage('Something went wrong', errMsg(e)));
})();
</script>
